<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイマスアイドルプロフィールデータベース</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#202638;--muted:#697386;--line:#dfe4ee;--accent:#4f46e5;--accent2:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,#292d69,#6557c8);color:#fff;padding:24px clamp(16px,4vw,48px)}
header h1{margin:0 0 6px;font-size:clamp(22px,3vw,32px)}header p{margin:0;color:#e3e5ff}
main{max-width:1600px;margin:22px auto;padding:0 18px 40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1b25500a}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.secondary{background:var(--accent2);color:#3730a3}.neutral{background:#eef0f4;color:#30394b}
button:hover{filter:brightness(.97)}
.note{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.6}
.status{margin-top:10px;color:#276749;font-size:13px;min-height:1em}
.filters{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-top:14px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#50596c}
input[type=text],select{width:100%;border:1px solid #cfd5e2;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid #c7d2fe;border-color:var(--accent)}
.stats{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 12px}
.count{font-size:18px;color:var(--ink);font-weight:800}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:66vh;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1350px;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:#f0f2fa;color:#31394d;text-align:left;white-space:nowrap}
th,td{padding:10px 12px;border-bottom:1px solid #e8ebf2;border-right:1px solid #edf0f5;vertical-align:top}
th:last-child,td:last-child{border-right:0}tbody tr:hover{background:#f8f9ff}
th button{padding:0;background:transparent;color:inherit;border-radius:0;font-size:13px}
td{white-space:pre-wrap;overflow-wrap:anywhere}
td:nth-child(2){font-weight:700;min-width:150px}td:nth-child(3){min-width:150px}
.empty{text-align:center;padding:36px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}
@media(max-width:900px){.filters{grid-template-columns:repeat(2,minmax(130px,1fr))}header{padding:20px}}
@media(max-width:480px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>アイマスアイドルプロフィールデータベース</h1>
  <p>ブランド・アイドル名・CV・誕生日・プロフィール情報をまとめて検索</p>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <button class="secondary" id="exportCsvBtn">⬇ 表示中の結果をCSV保存</button>
      <button class="secondary" id="exportXlsxBtn">⬇ 表示中の結果をExcel保存</button>
      <button class="neutral" id="clearBtn">検索条件をクリア</button>
    </div>
    <p class="note">全341人のプロフィールデータを内蔵しています。各項目の部分一致検索、ブランド絞り込み、列名クリックでの並べ替えができます。検索結果はCSVまたはExcel形式で保存できます。</p>
    <div class="status" id="status" role="status"></div>
  </section>
  <section class="panel">
    <div class="filters">
      <label class="field">ブランド
        <select id="brandFilter"><option value="">すべてのブランド</option></select>
      </label>
      <label class="field">アイドル名（部分一致）
        <input id="nameFilter" type="text" placeholder="例：天海春香">
      </label>
      <label class="field">CV（部分一致）
        <input id="cvFilter" type="text" placeholder="例：中村繪里子">
      </label>
      <label class="field">全項目検索
        <input id="allFilter" type="text" placeholder="名前・出身地・誕生日など">
      </label>
      <label class="field">年齢
        <input id="ageFilter" type="text" placeholder="例：16">
      </label>
      <label class="field">誕生日
        <input id="birthdayFilter" type="text" placeholder="例：4/3">
      </label>
      <label class="field">出身地
        <input id="birthplaceFilter" type="text" placeholder="例：東京都">
      </label>
      <label class="field">血液型
        <select id="bloodFilter"><option value="">すべて</option><option>A</option><option>B</option><option>O</option><option>AB</option><option>その他・不明</option></select>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="stats">
      <div>検索結果：<span class="count" id="count">341</span> 件</div>
      <div>列名をクリックすると昇順・降順で並べ替えできます。</div>
    </div>
    <div class="table-wrap">
      <table aria-label="アイドルプロフィール一覧">
        <thead><tr><th><button data-sort="ブランド">ブランド <span></span></button></th><th><button data-sort="名前">名前 <span></span></button></th><th><button data-sort="CV">CV <span></span></button></th><th><button data-sort="年齢">年齢 <span></span></button></th><th><button data-sort="誕生日">誕生日 <span></span></button></th><th><button data-sort="身長(cm)">身長(cm) <span></span></button></th><th><button data-sort="体重(kg)">体重(kg) <span></span></button></th><th><button data-sort="B(cm)">B(cm) <span></span></button></th><th><button data-sort="W(cm)">W(cm) <span></span></button></th><th><button data-sort="H(cm)">H(cm) <span></span></button></th><th><button data-sort="出身地">出身地 <span></span></button></th><th><button data-sort="血液型">血液型 <span></span></button></th><th><button data-sort="利き手">利き手 <span></span></button></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
  <footer>アイドルプロフィールデータベース</footer>
</main>

const filters={brand:'brandFilter',name:'nameFilter',cv:'cvFilter',all:'allFilter',age:'ageFilter',birthday:'birthdayFilter',birthplace:'birthplaceFilter',blood:'bloodFilter'};
const $=id=>document.getElementById(id);
let sortKey='名前', sortDir=1;
const norm=s=>String(s??'').toLocaleLowerCase('ja').trim();
function init(){
 const brands=[...new Set(data.map(x=>x['ブランド']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
 brands.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;$('brandFilter').appendChild(o)});
 Object.values(filters).forEach(id=>$(id).addEventListener('input',render));
 document.querySelectorAll('th button[data-sort]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()}));
 $('clearBtn').addEventListener('click',()=>{Object.values(filters).forEach(id=>$(id).value='');render()});
 $('exportCsvBtn').addEventListener('click',exportCsv);
 $('exportXlsxBtn').addEventListener('click',exportXlsx);
 render();
}
function getFiltered(){
 const brand=$('brandFilter').value, name=norm($('nameFilter').value), cv=norm($('cvFilter').value), all=norm($('allFilter').value), age=norm($('ageFilter').value), birthday=norm($('birthdayFilter').value), birthplace=norm($('birthplaceFilter').value), blood=$('bloodFilter').value;
 return data.filter(r=>{const allText=norm(columns.map(c=>r[c]).join(' '));
 return (!brand||r['ブランド']===brand)&&(!name||norm(r['名前']).includes(name))&&(!cv||norm(r['CV']).includes(cv))&&(!all||allText.includes(all))&&(!age||norm(r['年齢']).includes(age))&&(!birthday||norm(r['誕生日']).includes(birthday))&&(!birthplace||norm(r['出身地']).includes(birthplace))&&(!blood||(blood==='その他・不明'? !['A','B','O','AB'].includes(r['血液型']):r['血液型']===blood));
 });
}
function render(){
 const result=getFiltered().slice().sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),'ja',{numeric:true})*sortDir);
 $('count').textContent=result.length;
 document.querySelectorAll('th button[data-sort]').forEach(b=>{const s=b.querySelector('span');s.textContent=b.dataset.sort===sortKey?(sortDir===1?'▲':'▼'):''});
 const body=$('tbody');body.replaceChildren();
 if(!result.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=columns.length;td.className='empty';td.textContent='該当するアイドルが見つかりません。';tr.appendChild(td);body.appendChild(tr);return}
 const frag=document.createDocumentFragment();
 result.forEach(r=>{const tr=document.createElement('tr');columns.forEach(c=>{const td=document.createElement('td');td.textContent=r[c]??'';tr.appendChild(td)});frag.appendChild(tr)});
 body.appendChild(frag);
}
function exportCsv(){
 const result=getFiltered().slice().sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),'ja',{numeric:true})*sortDir);
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const csv='\ufeff'+[columns.map(esc).join(','),...result.map(r=>columns.map(c=>esc(r[c])).join(','))].join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});download(blob,'idol_profiles.csv');
}
function exportXlsx(){
 const result=getFiltered().slice().sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),'ja',{numeric:true})*sortDir);
 if(!window.XLSX){$('status').textContent='Excel出力にはインターネット接続が必要です。CSV保存をご利用ください。';return}
 const ws=XLSX.utils.json_to_sheet(result,{header:columns});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'プロフィール');XLSX.writeFile(wb,'idol_profiles.xlsx');$('status').textContent='Excelファイルを保存しました。';
}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
init();
